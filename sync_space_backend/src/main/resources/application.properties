spring.application.name=sync_space
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sync_space}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.jwt.secret=${APP_JWT_SECRET:dev-only-sync-space-jwt-secret-key}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Set to true to start a local Postgres process instead of docker-compose.
app.embedded-postgres=false
